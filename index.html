<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Time</title>
<meta name="description" content="Daily practice list for kids. Collect a star for every practice completed.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F0F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1524" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  color-scheme: light dark;
  --bg:#F0F3FA;
  --surface:#FFFFFF;
  --ink:#1B2236;
  --muted:#5D6880;
  --line:#DCE1EE;
  --ring:#8E9AB5;
  --gold:#F2B01E;
  --gold-line:#C98A00;
  --gold-bg:#FFF3D1;
  --gold-text:#7A5200;
  --link:#2A66D9;
  --danger:#B42A22;
  --danger-bg:#FBE4E1;
  --toast-action:#F5C043;
  --kid:#2A66D9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1524;
    --surface:#182036;
    --ink:#E9EDF7;
    --muted:#9AA6BF;
    --line:#2A3452;
    --ring:#62709A;
    --gold:#F5C043;
    --gold-line:#F5C043;
    --gold-bg:#3A2F10;
    --gold-text:#F5C043;
    --link:#8DB4FF;
    --danger:#FF8A80;
    --danger-bg:#3C1B19;
    --toast-action:#8A5C00;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none !important}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

.wrap{
  max-width:560px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(130px + env(safe-area-inset-bottom,0px));
}

/* header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;min-width:0;color:var(--muted);font-size:15px;font-weight:600}
h1{margin:6px 0 0;font-size:clamp(32px,10vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:4px 0;min-height:32px;font-size:14px;font-weight:700;color:var(--link)}
.tools{display:flex;gap:4px;flex:none}
.iconbtn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:0;
}
.iconbtn svg{width:22px;height:22px}

/* children */
.kids{
  display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:4px 16px 8px;
  scrollbar-width:none;
}
.kids::-webkit-scrollbar{display:none}
.kidchip{
  flex:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px 0 5px;
  border-radius:23px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;
}
.kidchip .avatar{width:36px;height:36px;font-size:16px}
.kidchip[aria-selected="true"]{background:var(--kid);border-color:var(--kid);color:#fff}
.kidchip[aria-selected="true"] .avatar{background:#fff;color:var(--kid)}
.kidadd{
  flex:none;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 16px 0 12px;
  border-radius:23px;background:transparent;border:1.5px dashed var(--ring);font-weight:700;color:var(--muted);
}
.kidadd svg{width:18px;height:18px}
.avatar{
  width:48px;height:48px;border-radius:50%;background:var(--kid);color:#fff;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:20px;
}

/* summary card */
.card{
  position:relative;overflow:hidden;margin-top:6px;padding:20px 16px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--kid)}
.card.party{background:var(--gold-bg)}
.cardhead{display:flex;align-items:center;gap:12px}
.cardhead h2{flex:1;min-width:0;margin:0;font-size:20px;line-height:1.25;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.stars{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.stars svg{width:30px;height:30px;fill:none;stroke:var(--ring);stroke-width:1.7;stroke-linejoin:round;opacity:.55}
.stars svg.on{fill:var(--gold);stroke:var(--gold-line);opacity:1}
.earned{margin:10px 0 0;font-weight:700;color:var(--gold-text)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--gold-bg);color:var(--gold-text);font-size:14px;font-weight:700;
}
.card.party .pill{background:var(--surface)}
.pill svg{width:16px;height:16px;fill:var(--gold);stroke:var(--gold-line);stroke-width:1.6;stroke-linejoin:round}

/* practice list */
.grouphead{margin:22px 4px 8px;font-size:14px;font-weight:700;color:var(--muted)}
.group{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;
  padding:8px 16px 8px 8px;min-height:68px;border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row.done{background:var(--gold-bg);background:color-mix(in srgb,var(--kid) 10%,var(--surface))}
.star{
  position:relative;width:52px;height:52px;padding:0;display:grid;place-items:center;
  background:none;border:0;border-radius:50%;
}
.star svg{width:36px;height:36px;fill:none;stroke:var(--ring);stroke-width:1.7;stroke-linejoin:round;transition:transform .12s}
.star:not(:disabled):active svg{transform:scale(.9)}
.star.on svg{fill:var(--gold);stroke:var(--gold-line)}
.star:disabled{cursor:default;opacity:.55}
.star.pop svg{animation:pop .42s ease-out}
@keyframes pop{0%{transform:scale(.7) rotate(-14deg)}55%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.namebtn{
  display:block;max-width:100%;background:none;border:0;padding:4px 0;text-align:left;
  font-size:17px;font-weight:650;overflow-wrap:anywhere;
}
.meta{display:flex;flex-wrap:wrap;gap:0 12px;font-size:14px;color:var(--muted)}
.stamp{
  display:inline-flex;align-items:center;min-height:26px;margin-top:3px;padding:2px 9px;
  font-size:13px;font-weight:700;color:var(--gold-text);background:var(--surface);
  border:1.5px dashed var(--gold-line);border-radius:7px;transform:rotate(-1.5deg);
}

.breaks{margin:18px 4px 0;font-size:14px;color:var(--muted)}
.breaks .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 0}
.breaks .linkbtn{flex:none}

.empty{text-align:center;padding:36px 12px 8px}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:750}
.empty p{margin:0 auto 18px;max-width:34ch;color:var(--muted)}
.empty .btn{max-width:260px;margin:0 auto}

/* week */
.week{margin-top:26px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 4px}
.wd{
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:78px;padding:6px 0;
  background:none;border:1.5px solid transparent;border-radius:14px;
}
.wd[aria-current="true"]{background:color-mix(in srgb,var(--kid) 12%,var(--surface));border-color:var(--kid)}
.wd .lt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.wd .num{min-width:26px;height:26px;padding:0 4px;display:grid;place-items:center;border-radius:13px;font-size:15px;font-weight:700}
.wd.today .num{background:var(--ink);color:var(--bg)}
.wd svg{width:24px;height:24px;margin-top:2px;fill:none;stroke:var(--gold-line);stroke-width:1.7;stroke-linejoin:round}
.wd.full svg{fill:var(--gold)}
.wd.some svg{fill:var(--gold-bg)}
.wd .dot{width:8px;height:8px;margin:10px 0 6px;border-radius:50%;background:var(--line)}
.weekstats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.add{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 24px 0 18px;border:0;border-radius:28px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;font-weight:750;
  background:var(--ink);color:var(--bg);box-shadow:0 8px 22px rgba(10,20,40,.28);z-index:10;
}
.add svg{width:22px;height:22px}

/* celebration sparkles */
.spark{
  position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:3px;background:var(--c);
  pointer-events:none;z-index:5;animation:fly .9s ease-out forwards;
}
@keyframes fly{
  from{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35) rotate(200deg);opacity:0}
}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(9,14,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet .sub{margin:0 0 16px;color:var(--muted);font-size:15px}
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.lbl .opt{color:var(--muted);font-weight:500}
input[type=text],input[type=number]{
  width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;
}
input:focus{border-color:var(--link)}

/* selectors built from radios / checkboxes */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seg3.two{grid-template-columns:1fr 1fr}
.seg3 label{position:relative;display:block}
.seg3 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg3 span{
  display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 6px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:650;font-size:15px;text-align:center;
}
.seg3 input:checked+span{border-color:transparent;background:var(--ink);color:var(--bg)}
.seg3 input:focus-visible+span,.daybtn input:focus-visible+span,.kidpick input:focus-visible+span,.swatch input:focus-visible+span{outline:3px solid var(--link);outline-offset:2px}

.daybtns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daybtn{position:relative;display:block}
.daybtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.daybtn span{
  display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);font-weight:700;
}
.daybtn input:checked+span{background:var(--ink);color:var(--bg);border-color:transparent}

.kidpicks{display:flex;flex-wrap:wrap;gap:8px}
.kidpick{position:relative;display:block}
.kidpick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.kidpick > span{
  display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px 0 5px;border-radius:23px;
  border:1.5px solid var(--line);background:var(--bg);font-weight:700;
}
.kidpick .avatar{width:34px;height:34px;font-size:15px}
.kidpick input:checked+span{background:var(--kid);border-color:var(--kid);color:#fff}
.kidpick input:checked+span .avatar{background:#fff;color:var(--kid)}

.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatch{position:relative;display:block}
.swatch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.swatch span{display:block;height:44px;border-radius:50%;background:var(--c);border:0}
.swatch input:checked+span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}

.switchrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:6px 0 14px}
.switchrow b{font-weight:650}
.switchrow small{display:block;color:var(--muted);font-size:13px}
input.switch{
  -webkit-appearance:none;appearance:none;flex:none;position:relative;margin:0;
  width:52px;height:32px;border-radius:16px;border:0;background:var(--ring);transition:background .15s;
}
input.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;transition:transform .15s;
}
input.switch:checked{background:var(--link)}
input.switch:checked::after{transform:translateX(20px)}
.btnrow{display:grid;gap:10px}
.btn{
  min-height:50px;width:100%;padding:0 18px;border-radius:14px;border:0;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.btn small{font-size:13px;font-weight:500;opacity:.85}
.btn.primary{background:var(--link);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.extras{margin-top:14px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch}
.textbtn{background:none;border:0;min-height:46px;padding:8px 4px;text-align:left;font-weight:650}
.textbtn.dangertext{color:var(--danger)}
.hint{margin:0 0 6px;color:var(--muted);font-size:13px}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:15px;font-weight:700}
.section p{margin:0 0 12px;color:var(--muted);font-size:14px}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.toast{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;z-index:30;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;
  padding:12px 14px 12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;
  box-shadow:0 8px 22px rgba(10,20,40,.3);
}
.toast button{background:none;border:0;padding:6px 4px;min-height:36px;font-weight:800;color:var(--toast-action)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div class="when">
        <span id="dateText"></span>
        <button class="linkbtn" id="todayBtn" type="button" hidden></button>
      </div>
      <div class="tools">
        <button class="iconbtn" id="prevBtn" type="button"></button>
        <button class="iconbtn" id="nextBtn" type="button"></button>
        <button class="iconbtn" id="settingsBtn" type="button"></button>
      </div>
    </div>
    <h1 id="dayName"></h1>
  </header>
  <nav class="kids" id="kids"></nav>
  <section id="summary" aria-live="polite"></section>
  <main id="list"></main>
  <section class="week" id="week"></section>
</div>
<button class="add" id="addBtn" type="button" hidden></button>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>

  function starSvg(cls) { return '<svg viewBox="0 0 24 24" class="' + (cls || '') + '" aria-hidden="true"><path d="' + STAR_PATH + '"/></svg>'; }

  /* ---------- text (Polish / English) ---------- */
  var T = {

      weekThis: 'Ten tydzień', weekOf: function (x) { return 'Tydzień od ' + x; },
      weekDays: function (n) { return 'Dni ćwiczeń: ' + n; }, weekMinutes: function (n) { return 'Minuty: ' + n; },

  };

  function autoLang() { return String(navigator.language || 'en').toLowerCase().indexOf('pl') === 0 ? 'pl' : 'en'; }
  function lang() { return state.lang || autoLang(); }
  function t(key, a, b) {
    var v = T[lang()][key];
    if (v === undefined) v = T.en[key];
    return typeof v === 'function' ? v(a, b) : v;
  }
  function locale() { return lang() === 'pl' ? 'pl-PL' : 'en-GB'; }

  /* ---------- dates ---------- */
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function isoToDate(iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dateToISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function shiftDay(iso, delta) { var d = isoToDate(iso); d.setDate(d.getDate() + delta); return dateToISO(d); }
  function daysBetween(a, b) { return Math.round((isoToDate(b) - isoToDate(a)) / 86400000); }
  function dow(iso) { return isoToDate(iso).getDay(); }
  function mondayOf(iso) { return shiftDay(iso, -((dow(iso) + 6) % 7)); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function maxISO(a, b) { return a > b ? a : b; }
  function fmtDate(iso, weekday) {
    var d = isoToDate(iso);
    var o = { day: 'numeric', month: 'short' };
    if (weekday) o.weekday = 'short';
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    return d.toLocaleDateString(locale(), o);
  }
  function weekdayName(n, style) { return new Date(2024, 0, 7 + n).toLocaleDateString(locale(), { weekday: style }); }   // 7 Jan 2024 was a Sunday
  function fromWord(day) {
    var diff = daysBetween(live, day);
    return diff === 0 ? t('fromToday') : diff === 1 ? t('fromTomorrow') : diff === -1 ? t('fromYesterday') : fmtDate(day, false);
  }

  /* ---------- data ---------- */
  // kids   : { id, name, color }
  // tasks  : { id, kidId, text, minutes, days[], from, until, created }  (the repeating "template")
  // done   : done[day][taskId] = { t: 'HH:MM' }   (one entry = one star earned)
  // skipped: skipped[day] = [taskId]              (a break for one day)
  // Each day's list is worked out from the tasks, so every new day starts fresh by itself.
  function blank() { return { version: 1, lang: '', kids: [], tasks: [], done: {}, skipped: {}, activeKid: '' }; }

  function sanitize(d) {
    var out = blank();
    if (!d || typeof d !== 'object') return out;
    if (d.lang === 'pl' || d.lang === 'en') out.lang = d.lang;
    var dre = /^\d{4}-\d{2}-\d{2}$/, tre = /^\d{2}:\d{2}$/, kidIds = {}, taskIds = {};
    (Array.isArray(d.kids) ? d.kids : []).forEach(function (k) {
      if (!k || typeof k.id !== 'string' || typeof k.name !== 'string' || kidIds[k.id]) return;
      kidIds[k.id] = true;
      out.kids.push({ id: k.id, name: k.name.slice(0, 30), color: COLORS.indexOf(k.color) !== -1 ? k.color : COLORS[0] });
    });
    (Array.isArray(d.tasks) ? d.tasks : []).forEach(function (k) {
      if (!k || typeof k.id !== 'string' || typeof k.text !== 'string' || !kidIds[k.kidId] || taskIds[k.id] || !dre.test(k.from)) return;
      taskIds[k.id] = true;
      var days = (Array.isArray(k.days) ? k.days : []).filter(function (n, i, a) { return Number.isInteger(n) && n >= 0 && n <= 6 && a.indexOf(n) === i; });
      out.tasks.push({
        id: k.id, kidId: k.kidId, text: k.text.slice(0, 80),
        minutes: (Number.isInteger(k.minutes) && k.minutes >= 1 && k.minutes <= 600) ? k.minutes : null,
        days: days.length ? days : ALL_DAYS.slice(),
        from: k.from, until: dre.test(k.until) ? k.until : null,
        created: typeof k.created === 'number' ? k.created : 0
      });
    });
    if (d.done && typeof d.done === 'object') {
      Object.keys(d.done).forEach(function (day) {
        if (!dre.test(day) || !d.done[day] || typeof d.done[day] !== 'object') return;
        Object.keys(d.done[day]).forEach(function (id) {
          if (!taskIds[id]) return;
          var r = d.done[day][id];
          if (!out.done[day]) out.done[day] = {};
          out.done[day][id] = { t: (r && tre.test(r.t)) ? r.t : '' };
        });
      });
    }
    if (d.skipped && typeof d.skipped === 'object') {
      Object.keys(d.skipped).forEach(function (day) {
        if (!dre.test(day) || !Array.isArray(d.skipped[day])) return;
        out.skipped[day] = d.skipped[day].filter(function (id) { return taskIds[id]; });
      });
    }
    out.activeKid = kidIds[d.activeKid] ? d.activeKid : (out.kids[0] ? out.kids[0].id : '');
    return out;
  }

  var state = load();
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return sanitize(JSON.parse(raw)); } catch (e) { /* fresh start */ }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast(t('tSaveFail')); }
  }

  var live = todayISO();   // the real today
  var view = live;         // the day on screen
  var pending = null;      // sparkle request handled after the next render

  function currentKid() {
    var k = state.kids.filter(function (x) { return x.id === state.activeKid; })[0] || state.kids[0] || null;
    if (k) state.activeKid = k.id;
    return k;
  }
  function findTask(id) { return state.tasks.filter(function (k) { return k.id === id; })[0]; }
  function findKid(id) { return state.kids.filter(function (k) { return k.id === id; })[0]; }
  function isDone(id, day) { return !!(state.done[day] && state.done[day][id]); }
  function isSkipped(k, day) { return (state.skipped[day] || []).indexOf(k.id) !== -1; }
  function scheduled(k, day) { return k.from <= day && (!k.until || day <= k.until) && k.days.indexOf(dow(day)) !== -1; }
  function byCreated(a, b) { return a.created - b.created; }
  // What shows for a child on a day: planned practices, plus anything already completed that day (so history stays intact).
  function tasksOn(kidId, day) {
    return state.tasks.filter(function (k) {
      return k.kidId === kidId && ((scheduled(k, day) && !isSkipped(k, day)) || isDone(k.id, day));
    }).sort(byCreated);
  }
  function breaksOn(kidId, day) {
    return state.tasks.filter(function (k) { return k.kidId === kidId && scheduled(k, day) && isSkipped(k, day) && !isDone(k.id, day); }).sort(byCreated);
  }
  function starsOn(kidId, day) {
    var ts = tasksOn(kidId, day);
    return { total: ts.length, done: ts.filter(function (k) { return isDone(k.id, day); }).length };
  }
  function totalStars(kidId) {
    var n = 0;
    Object.keys(state.done).forEach(function (day) {
      Object.keys(state.done[day]).forEach(function (id) { var k = findTask(id); if (k && k.kidId === kidId) n++; });
    });
    return n;
  }
  // Days in a row with at least one star. Rest days and today (before practice) never break it.
  function streak(kidId) {
    var earliest = live;
    state.tasks.forEach(function (k) { if (k.kidId === kidId && k.from < earliest) earliest = k.from; });
    var n = 0, d = live;
    for (var i = 0; i < 800 && d >= earliest; i++) {
      var s = starsOn(kidId, d);
      if (s.total === 0) { /* rest day */ }
      else if (s.done > 0) n++;
      else if (d === live) { /* not practised yet today */ }
      else break;
      d = shiftDay(d, -1);
    }
    return n;
  }

  /* ---------- actions ---------- */
  // Every change goes through here, so every change can be undone from the toast.
  function change(message, fn) {
    var snapshot = JSON.stringify(state);
    fn();
    save();
    render();
    toast(message, { label: t('undo'), fn: function () { state = sanitize(JSON.parse(snapshot)); save(); render(); } });
  }
  function toggleStar(id, day) {
    var k = findTask(id), kid = findKid(k.kidId);
    if (isDone(id, day)) {
      change(t('tUpdated'), function () { delete state.done[day][id]; });
      return;
    }
    var newTotal = totalStars(kid.id) + 1;
    var s = starsOn(kid.id, day);
    var msg = (newTotal === 10 || newTotal === 25 || newTotal === 50 || (newTotal >= 100 && newTotal % 100 === 0)) ? t('milestone', newTotal) : t('tStar');
    pending = { id: id, all: s.done + 1 === s.total };
    change(msg, function () {
      if (!state.done[day]) state.done[day] = {};
      state.done[day][id] = { t: day === live ? nowTime() : '' };
    });
  }
  function addKid(name, color) {
    var k = { id: uid(), name: name, color: color };
    state.kids.push(k); state.activeKid = k.id; save(); render();
  }
  function updateKid(id, name, color) { var k = findKid(id); k.name = name; k.color = color; save(); render(); }
  function removeKid(id) {
    var ids = state.tasks.filter(function (k) { return k.kidId === id; }).map(function (k) { return k.id; });
    state.tasks = state.tasks.filter(function (k) { return k.kidId !== id; });
    Object.keys(state.done).forEach(function (day) { ids.forEach(function (x) { delete state.done[day][x]; }); });
    Object.keys(state.skipped).forEach(function (day) { state.skipped[day] = state.skipped[day].filter(function (x) { return ids.indexOf(x) === -1; }); });
    state.kids = state.kids.filter(function (k) { return k.id !== id; });
    if (state.activeKid === id) state.activeKid = state.kids[0] ? state.kids[0].id : '';
  }
  function addTasks(kidIds, f) {
    var now = Date.now();
    kidIds.forEach(function (kidId, i) {
      state.tasks.push({ id: uid(), kidId: kidId, text: f.text, minutes: f.minutes, days: f.days.slice(), from: f.from, until: f.repeat ? null : f.from, created: now + i });
    });
    save(); render();
  }
  function updateTask(id, f) {
    var k = findTask(id);
    k.text = f.text; k.minutes = f.minutes;
    if (f.repeat) { k.days = f.days.slice(); k.until = null; }
    else if (k.until === null) { k.until = maxISO(view, k.from); k.days = ALL_DAYS.slice(); }
    save(); render();
  }
  function skipDay(id, day) {
    if (!state.skipped[day]) state.skipped[day] = [];
    if (state.skipped[day].indexOf(id) === -1) state.skipped[day].push(id);
  }
  function unskipDay(id, day) { state.skipped[day] = (state.skipped[day] || []).filter(function (x) { return x !== id; }); }
  // Removes a practice from `start` onward. Earlier days keep their stars.
  function removeFrom(id, start) {
    var k = findTask(id);
    k.until = shiftDay(start, -1);
    Object.keys(state.done).forEach(function (day) { if (day >= start) delete state.done[day][id]; });
    Object.keys(state.skipped).forEach(function (day) { if (day >= start) state.skipped[day] = state.skipped[day].filter(function (x) { return x !== id; }); });
    if (k.until < k.from) {
      state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
      Object.keys(state.done).forEach(function (day) { delete state.done[day][id]; });
    }
  }

  /* ---------- rendering ---------- */
  function pick(arr, salt) { return arr[(daysBetween('2020-01-01', view) + salt) % arr.length]; }
  function message(kid, s) {
    var n = kid.name;
    if (view > live) return t('comingUp');
    if (s.total === 0) return t('restDay', n);
    if (s.done === 0) return view < live ? t('freshStart', n) : pick(t('msgStart'), 0).replace('{n}', n);
    if (s.done < s.total) return pick(t('msgSome'), s.done).replace('{n}', n);
    return pick(t('msgAll'), s.done).replace('{n}', n);
  }
  function avatar(kid) { return h('span', { class: 'avatar', style: '--kid:' + kid.color }, Array.from(kid.name)[0].toUpperCase()); }
  function daysText(k) {
    var d = k.days.slice().sort().join();
    if (d === '0,1,2,3,4,5,6') return '';
    if (d === '1,2,3,4,5') return t('weekdays');
    if (d === '0,6') return t('weekends');
    return MON_FIRST.filter(function (n) { return k.days.indexOf(n) !== -1; }).map(function (n) { return weekdayName(n, 'short'); }).join(', ');
  }

  function renderKids() {
    var nav = $('#kids');
    nav.replaceChildren();
    nav.setAttribute('aria-label', t('kidsNav'));
    if (!state.kids.length) return;
    nav.setAttribute('role', 'tablist');
    state.kids.forEach(function (k) {
      nav.appendChild(h('button', {
        class: 'kidchip', type: 'button', role: 'tab', style: '--kid:' + k.color,
        'aria-selected': k.id === state.activeKid ? 'true' : 'false', 'aria-label': t('aShow') + k.name,
        onclick: function () { state.activeKid = k.id; save(); render(); }
      }, avatar(k), k.name));
    });
    nav.appendChild(h('button', { class: 'kidadd', type: 'button', 'aria-label': t('addKid'), onclick: function () { kidSheet(null); } }, h('span', { html: ICON.plus, style: 'display:flex' }), t('addKidShort')));
  }

  function renderSummary(kid) {
    var box = $('#summary');
    box.replaceChildren();
    if (!kid) {
      box.appendChild(h('div', { class: 'empty' },
        h('h2', null, t('welcomeTitle')), h('p', null, t('welcomeText')),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { kidSheet(null); } }, t('addKid'))));
      return;
    }
    var s = starsOn(kid.id, view);
    var allDone = s.total > 0 && s.done === s.total && view <= live;
    var card = h('div', { class: 'card' + (allDone ? ' party' : ''), style: '--kid:' + kid.color },
      h('div', { class: 'cardhead' },
        avatar(kid),
        h('h2', null, message(kid, s)),
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': t('aEditKid') + kid.name, html: ICON.pencil, onclick: function () { kidSheet(kid); } })));
    if (s.total > 0) {
      var stars = h('div', { class: 'stars', role: 'img', 'aria-label': t('aStars', s.done, s.total) });
      for (var i = 0; i < s.total; i++) stars.appendChild(h('span', { html: starSvg(i < s.done ? 'on' : '') , style: 'display:flex'}));
      card.appendChild(stars);
      if (s.done > 0) card.appendChild(h('p', { class: 'earned' }, t('starsEarned', s.done)));
    }
    var pills = [], st = streak(kid.id), total = totalStars(kid.id);
    if (st >= 2) pills.push(h('span', { class: 'pill' }, h('span', { html: starSvg(), style: 'display:flex' }), t('streak', st)));
    if (total > 0 && total !== s.done) pills.push(h('span', { class: 'pill' }, h('span', { html: starSvg(), style: 'display:flex' }), t('totalStars', total)));
    if (pills.length) card.appendChild(h('div', { class: 'pills' }, pills));
    box.appendChild(card);
    if (pending && pending.all) { sparkle(card, 26, true); }
  }

  function rowFor(k, kid) {
    var done = isDone(k.id, view), future = view > live;
    var rec = done ? state.done[view][k.id] : null;
    var star = h('button', {
      class: 'star' + (done ? ' on' : '') + (pending && pending.id === k.id ? ' pop' : ''), type: 'button', 'data-star': k.id,
      'aria-pressed': done ? 'true' : 'false', 'aria-label': (done ? t('aUndone') : t('aDone')) + k.text,
      disabled: future, html: ICON.star, onclick: function () { toggleStar(k.id, view); }
    });
    var days = daysText(k);
    var meta = (k.minutes || days) ? h('div', { class: 'meta' }, k.minutes ? h('span', null, t('minutes', k.minutes)) : null, days ? h('span', null, days) : null) : null;
    return h('li', { class: 'row' + (done ? ' done' : ''), style: '--kid:' + kid.color },
      star,
      h('div', null,
        h('button', { class: 'namebtn', type: 'button', 'aria-label': t('aEdit') + k.text, onclick: function () { taskSheet(k); } }, k.text),
        meta,
        done ? h('span', { class: 'stamp' }, t('doneAt', rec.t)) : null));
  }

  function renderList(kid) {
    var list = $('#list');
    list.replaceChildren();
    if (!kid) return;
    var out = [];
    var items = tasksOn(kid.id, view);
    var hasAny = state.tasks.some(function (k) { return k.kidId === kid.id; });
    if (!hasAny) {
      out.push(h('div', { class: 'empty' }, h('h2', null, t('noPracticeTitle')), h('p', null, t('noPracticeText', kid.name))));
    }
    if (items.length) {
      out.push(h('div', { class: 'grouphead' }, t('practiceHead')));
      out.push(h('ul', { class: 'group' }, items.map(function (k) { return rowFor(k, kid); })));
    }
    var breaks = breaksOn(kid.id, view);
    if (breaks.length) {
      out.push(h('div', { class: 'breaks' },
        h('div', null, t('breakHead') + ':'),
        breaks.map(function (k) {
          return h('div', { class: 'srow' }, h('span', null, k.text),
            h('button', { class: 'linkbtn', type: 'button', onclick: function () {
              change(t('tBack', k.text), function () { unskipDay(k.id, view); });
            } }, t('addBack')));
        })));
    }
    list.replaceChildren.apply(list, out);
    if (pending) {
      var btn = list.querySelector('[data-star="' + pending.id + '"]');
      if (btn) sparkle(btn, 9, false);
    }
    pending = null;
  }

  function renderWeek(kid) {
    var box = $('#week');
    box.replaceChildren();
    if (!kid || !state.tasks.some(function (k) { return k.kidId === kid.id; })) return;
    var mon = mondayOf(view), practiced = 0, minutes = 0, cells = [];
    for (var i = 0; i < 7; i++) {
      (function (day) {
        var s = starsOn(kid.id, day);
        var cls = s.total > 0 && s.done === s.total ? 'full' : s.done > 0 ? 'some' : 'none';
        if (s.done > 0) practiced++;
        tasksOn(kid.id, day).forEach(function (k) { if (isDone(k.id, day) && k.minutes) minutes += k.minutes; });
        var d = isoToDate(day);
        cells.push(h('button', {
          class: 'wd ' + cls + (day === live ? ' today' : ''), type: 'button', 'aria-current': day === view ? 'true' : null,
          'aria-label': d.toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' }),
          onclick: function () { view = day; render(); }
        },
          h('span', { class: 'lt' }, d.toLocaleDateString(locale(), { weekday: 'narrow' })),
          h('span', { class: 'num' }, String(d.getDate())),
          cls === 'none' ? h('span', { class: 'dot' }) : h('span', { html: starSvg(), style: 'display:flex' })));
      })(shiftDay(mon, i));
    }
    var heading = mon === mondayOf(live) ? t('weekThis') : t('weekOf', fmtDate(mon, false));
    box.appendChild(h('div', { class: 'grouphead' }, heading));
    box.appendChild(h('div', { class: 'weekstrip', style: '--kid:' + kid.color }, cells));
    var stats = [];
    if (practiced > 0) stats.push(h('span', { class: 'pill' }, t('weekDays', practiced)));
    if (minutes > 0) stats.push(h('span', { class: 'pill' }, t('weekMinutes', minutes)));
    if (stats.length) box.appendChild(h('div', { class: 'weekstats' }, stats));
  }

  function render() {
    var kid = currentKid();
    var diff = daysBetween(live, view);
    var rel = diff === 0 ? t('today') : diff === 1 ? t('tomorrow') : diff === -1 ? t('yesterday') : null;
    var d = isoToDate(view);
    $('#dayName').textContent = rel || cap(d.toLocaleDateString(locale(), { weekday: 'long' }));
    var dopts = { day: 'numeric', month: 'long' };
    if (d.getFullYear() !== new Date().getFullYear()) dopts.year = 'numeric';
    if (rel) dopts.weekday = 'short';
    $('#dateText').textContent = d.toLocaleDateString(locale(), dopts);
    $('#todayBtn').hidden = view === live;
    $('#addBtn').hidden = !kid;
    renderKids();
    renderSummary(kid);
    renderList(kid);
    renderWeek(kid);
    pending = null;
  }

  function applyLang() {
    document.documentElement.lang = lang();
    document.title = t('appName');
    $('#prevBtn').setAttribute('aria-label', t('prevDay'));
    $('#nextBtn').setAttribute('aria-label', t('nextDay'));
    $('#settingsBtn').setAttribute('aria-label', t('settings'));
    $('#todayBtn').textContent = t('back');
    $('#addBtn').innerHTML = ICON.plus;
    $('#addBtn').appendChild(h('span', null, t('addPractice')));
  }

  // small celebration burst (skipped for people who prefer reduced motion)
  function sparkle(host, count, big) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cols = ['#F2B01E', '#2A66D9', '#C93585', '#1B8552', '#7B4BD1'];
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i / count) + Math.random() * 0.5;
      var r = (big ? 90 : 42) + Math.random() * (big ? 70 : 22);
      var s = h('span', { class: 'spark', 'aria-hidden': 'true',
        style: '--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r) + 'px;--c:' + cols[i % cols.length] });
      host.appendChild(s);
      setTimeout((function (x) { return function () { x.remove(); }; })(s), 1000);
    }
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(message, action) {
    var root = $('#toastRoot');
    clearTimeout(toastTimer);
    root.replaceChildren();
    var el = h('div', { class: 'toast', role: 'status' }, h('span', null, message));
    if (action) {
      el.appendChild(h('button', { type: 'button', onclick: function () {
        clearTimeout(toastTimer); root.replaceChildren(); action.fn();
      } }, action.label));
    }
    root.appendChild(el);
    toastTimer = setTimeout(function () { root.replaceChildren(); }, action ? 6000 : 3500);
  }

  /* ---------- sheets (bottom dialogs) ---------- */
  var sheetEl = null, sheetHistory = false;
  function openSheet(title, sub, nodes, focusFirst) {
    var content = [h('div', { class: 'grab' }), h('h2', null, title), sub ? h('p', { class: 'sub' }, sub) : null, nodes];
    if (sheetEl) {                       // swap content in place
      var sheet = sheetEl.firstChild;
      sheet.replaceChildren.apply(sheet, content.filter(Boolean).flat());
      sheet.scrollTop = 0;
      return;
    }
    clearTimeout(toastTimer); $('#toastRoot').replaceChildren();
    var box = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    append(box, content);
    sheetEl = h('div', { class: 'scrim', onclick: function (e) { if (e.target === sheetEl) closeSheet(); } }, box);
    $('#sheetRoot').appendChild(sheetEl);
    // Lets the Android back button close the sheet instead of leaving the app.
    try { history.pushState({ sheet: 1 }, ''); sheetHistory = true; } catch (e) { sheetHistory = false; }
    if (focusFirst) { var first = box.querySelector('input[type=text]'); if (first) first.focus(); }
  }
  function removeSheetEl() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
  function closeSheet() {
    if (!sheetEl) return;
    if (sheetHistory) { sheetHistory = false; history.back(); }
    else removeSheetEl();
  }
  window.addEventListener('popstate', removeSheetEl);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function field(label, input, optional) {
    return h('label', { class: 'field' }, h('span', { class: 'lbl' }, label, optional ? h('span', { class: 'opt' }, t('optional')) : null), input);
  }
  function button(cls, label, onclick, type, sub) {
    return h('button', { class: 'btn ' + cls, type: type || 'button', onclick: onclick }, label, sub ? h('small', null, sub) : null);
  }
  function segmented(name, options, current, extraClass, onchange) {
    var wrap = h('div', { class: 'seg3' + (extraClass ? ' ' + extraClass : ''), role: 'radiogroup' });
    options.forEach(function (o) {
      var r = h('input', { type: 'radio', name: name, value: o.value, checked: o.value === current });
      if (onchange) r.addEventListener('change', function () { onchange(o.value); });
      wrap.appendChild(h('label', null, r, h('span', null, o.label)));
    });
    return wrap;
  }

  function kidSheet(existing) {
    var editing = !!existing;
    var nameI = h('input', { type: 'text', required: true, maxlength: '30', placeholder: t('kidNamePh'), autocomplete: 'off', autocapitalize: 'words', value: editing ? existing.name : '' });
    var current = editing ? existing.color : COLORS[state.kids.length % COLORS.length];
    var sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': t('color') }, COLORS.map(function (c) {
      return h('label', { class: 'swatch' }, h('input', { type: 'radio', name: 'color', value: c, checked: c === current }), h('span', { style: '--c:' + c }));
    }));
    var form = h('form', { onsubmit: function (e) {
      e.preventDefault();
      var name = nameI.value.trim();
      if (!name) { nameI.focus(); return; }
      var checked = sw.querySelector('input:checked');
      var color = checked ? checked.value : COLORS[0];
      if (editing) { updateKid(existing.id, name, color); closeSheet(); toast(t('tSaved')); }
      else { addKid(name, color); closeSheet(); toast(t('tAddedKid', name)); }
    } },
      field(t('kidName'), nameI),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('color')), sw),
      h('div', { class: 'btnrow' },
        button('primary', editing ? t('save') : t('addBtn'), null, 'submit'),
        button('ghost', t('cancel'), closeSheet)));
    var nodes = [form];
    if (editing) {
      nodes.push(h('div', { class: 'extras' },
        h('button', { class: 'textbtn dangertext', type: 'button', onclick: function () { removeKidSheet(existing); } }, t('removeKid'))));
    }
    openSheet(editing ? t('editKid') : t('newKid'), null, nodes, !editing);
  }

  function removeKidSheet(kid) {
    openSheet(t('removeKidTitle', kid.name), t('removeKidText'), [
      h('div', { class: 'btnrow' },
        button('danger', t('removeKidGo'), function () {
          var name = kid.name;
          closeSheet();
          change(t('tKidRemoved', name), function () { removeKid(kid.id); });
        }),
        button('ghost', t('keepIt'), closeSheet))
    ]);
  }

  function taskSheet(existing) {
    var editing = !!existing, today = live;
    var kid = currentKid();
    var textI = h('input', { type: 'text', required: true, maxlength: '80', placeholder: t('taskPh'), autocomplete: 'off', autocapitalize: 'sentences', value: editing ? existing.text : '' });
    var minI = h('input', { type: 'number', inputmode: 'numeric', min: '1', max: '600', step: '1', placeholder: '20', value: editing && existing.minutes ? String(existing.minutes) : '' });
    var repI = h('input', { type: 'checkbox', class: 'switch', role: 'switch', checked: editing ? existing.until === null : true });
    var startDays = editing ? existing.days : ALL_DAYS;
    var dayBox = h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('daysLbl')),
      h('div', { class: 'daybtns' }, MON_FIRST.map(function (n) {
        return h('label', { class: 'daybtn' },
          h('input', { type: 'checkbox', value: String(n), checked: startDays.indexOf(n) !== -1, 'aria-label': weekdayName(n, 'long') }),
          h('span', null, weekdayName(n, 'narrow')));
      })));
    dayBox.hidden = !repI.checked;
    repI.addEventListener('change', function () { dayBox.hidden = !repI.checked; });

    var kidBox = null;
    if (!editing && state.kids.length > 1) {
      kidBox = h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('forWho')),
        h('div', { class: 'kidpicks' }, state.kids.map(function (k) {
          return h('label', { class: 'kidpick', style: '--kid:' + k.color },
            h('input', { type: 'checkbox', value: k.id, checked: kid && k.id === kid.id }),
            h('span', null, avatar(k), k.name));
        })));
    }

    var form = h('form', { onsubmit: function (e) {
      e.preventDefault();
      var text = textI.value.trim();
      if (!text) { textI.focus(); return; }
      var mins = parseInt(minI.value, 10);
      var days = ALL_DAYS.slice();
      if (repI.checked) {
        days = [].map.call(dayBox.querySelectorAll('input:checked'), function (i) { return Number(i.value); });
        if (!days.length) { toast(t('pickDay')); return; }
      }
      var f = { text: text, minutes: (mins >= 1 && mins <= 600) ? mins : null, days: days, repeat: repI.checked };
      if (editing) { updateTask(existing.id, f); closeSheet(); toast(t('tSaved')); return; }
      var kidIds = kidBox ? [].map.call(kidBox.querySelectorAll('input:checked'), function (i) { return i.value; }) : [kid.id];
      if (!kidIds.length) { toast(t('pickKid')); return; }
      f.from = maxISO(view, today);
      addTasks(kidIds, f);
      if (f.from !== view) { view = f.from; render(); }
      closeSheet();
      toast(t('tAddedPractice', text));
    } },
      field(t('task'), textI),
      kidBox,
      field(t('minutesLbl'), minI, true),
      h('label', { class: 'switchrow' }, h('span', null, h('b', null, t('repeatLbl')), h('small', null, t('repeatHint'))), repI),
      dayBox,
      h('div', { class: 'btnrow' },
        button('primary', editing ? t('save') : t('addBtn'), null, 'submit'),
        button('ghost', t('cancel'), closeSheet)));

    var nodes = [form];
    if (editing) {
      var canBreak = scheduled(existing, view) && !isDone(existing.id, view) && view >= today && (existing.until === null || existing.until > view || existing.days.length < 7);
      nodes.push(h('div', { class: 'extras' },
        canBreak ? h('button', { class: 'textbtn', type: 'button', onclick: function () {
          var name = existing.text; closeSheet();
          change(t('tBreak', name), function () { skipDay(existing.id, view); });
        } }, t('breakBtn', view === today)) : null,
        canBreak ? h('p', { class: 'hint' }, t('breakHint')) : null,
        h('button', { class: 'textbtn dangertext', type: 'button', onclick: function () { removeTaskSheet(existing.id); } }, t('removePractice'))));
    }
    openSheet(editing ? t('editPractice') : t('newPractice'), null, nodes, !editing);
  }

  function removeTaskSheet(id) {
    var k = findTask(id), next = shiftDay(view, 1);
    var continues = k.until === null || k.until > view;
    var nodes;
    if (continues) {
      nodes = h('div', { class: 'btnrow' },
        button('danger', t('removeFrom', fromWord(next)), function () {
          closeSheet(); change(t('tRemoved', k.text), function () { removeFrom(id, next); });
        }, 'button', t('stays')),
        button('danger', t('removeFrom', fromWord(view)), function () {
          closeSheet(); change(t('tRemoved', k.text), function () { removeFrom(id, view); });
        }, 'button', t('cleared')),
        button('ghost', t('keepIt'), closeSheet));
    } else {
      nodes = h('div', { class: 'btnrow' },
        button('danger', t('removeOne'), function () {
          closeSheet(); change(t('tRemoved', k.text), function () { removeFrom(id, view); });
        }),
        button('ghost', t('keepIt'), closeSheet));
    }
    openSheet(t('removeTitle', k.text), t('removeSub'), [nodes]);
  }

  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; toast(t('installed')); });

  function settingsSheet() {
    var langSeg = segmented('lang', [{ value: 'pl', label: 'Polski' }, { value: 'en', label: 'English' }], lang(), 'two', function (v) {
      state.lang = v; save(); applyLang(); render(); settingsSheet();
    });
    var fileI = h('input', { type: 'file', accept: 'application/json,.json', class: 'vis', tabindex: '-1', 'aria-hidden': 'true',
      onchange: function () { importFile(fileI.files[0]); fileI.value = ''; } });
    openSheet(t('settingsTitle'), null, [
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('language')), langSeg),
      deferredInstall ? h('div', { class: 'section' }, h('h3', null, t('install')),
        h('p', null, t('installText')),
        button('primary', t('installBtn'), function () { var ev = deferredInstall; deferredInstall = null; closeSheet(); ev.prompt(); })) : null,
      h('div', { class: 'section' }, h('h3', null, t('backup')),
        h('p', null, t('backupText')),
        h('div', { class: 'btnrow' },
          button('ghost', t('saveBackup'), exportData),
          button('ghost', t('restore'), function () { fileI.click(); }),
          fileI)),
      h('div', { class: 'section' }, h('h3', null, t('erase')), button('danger', t('eraseBtn'), eraseSheet)),
      h('div', { class: 'btnrow', style: 'margin-top:22px' }, button('ghost', t('close'), closeSheet))
    ]);
  }

  function eraseSheet() {
    openSheet(t('eraseTitle'), t('eraseText'), [
      h('div', { class: 'btnrow' },
        button('danger', t('eraseGo'), function () {
          var keepLang = state.lang; state = blank(); state.lang = keepLang; save(); view = live; closeSheet(); render(); toast(t('erased'));
        }),
        button('ghost', t('cancel'), closeSheet))
    ]);
  }

  function exportData() {
    var payload = Object.assign({ app: 'practiceTime' }, state);
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: 'practice-time-backup-' + todayISO() + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast(t('backupDone'));
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try {
        var parsed = JSON.parse(reader.result);
        if (parsed && parsed.app === 'practiceTime' && Array.isArray(parsed.kids)) data = sanitize(parsed);
      } catch (e) { data = null; }
      if (!data) { toast(t('badFile')); return; }
      openSheet(t('restoreTitle'), t('restoreText', data.kids.length), [
        h('div', { class: 'btnrow' },
          button('primary', t('restoreGo'), function () {
            state = data; save(); view = live; closeSheet(); applyLang(); render(); toast(t('restored'));
          }),
          button('ghost', t('cancel'), closeSheet))
      ]);
    };
    reader.onerror = function () { toast(t('readFail')); };
    reader.readAsText(file);
  }

  /* ---------- wiring ---------- */
  $('#prevBtn').innerHTML = ICON.left;
  $('#nextBtn').innerHTML = ICON.right;
  $('#settingsBtn').innerHTML = ICON.tune;
  $('#prevBtn').addEventListener('click', function () { view = shiftDay(view, -1); render(); });
  $('#nextBtn').addEventListener('click', function () { view = shiftDay(view, 1); render(); });
  $('#todayBtn').addEventListener('click', function () { view = live; render(); });
  $('#addBtn').addEventListener('click', function () { taskSheet(null); });
  $('#settingsBtn').addEventListener('click', settingsSheet);

  // A new day starts with a fresh list. Runs when the app comes back to the foreground and once a minute.
  function checkNewDay() {
    var now = todayISO();
    if (now === live) return;
    var following = view === live;
    live = now;
    if (following) view = now;
    render();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkNewDay(); });
  setInterval(checkNewDay, 60000);

  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  applyLang();
  render();
})();
</script>
</body>
</html>
